name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: omoikane_readiness
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate V3 upgrade and business persistence on disposable PostgreSQL
        env:
          READINESS_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55432/omoikane_readiness
          READINESS_TEST_DATABASE_USERNAME: postgres
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PostgresReadinessIT test

      - name: Build deployable container
        run: docker build --file Dockerfile --tag omoikane-api:ci .
