name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: omoikane_readiness
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Validate V3 upgrade and business persistence on disposable PostgreSQL
        env:
          READINESS_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:55432/omoikane_readiness
          READINESS_TEST_DATABASE_USERNAME: postgres
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PostgresReadinessIT test

      - name: Rehearse backup and restore on the disposable PostgreSQL 18 fixture
        env:
          READINESS_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          docker exec "$READINESS_PG_CONTAINER" pg_dump -U postgres -d omoikane_readiness -Fc > "$fixture/recovery.dump"
          docker exec "$READINESS_PG_CONTAINER" createdb -U postgres omoikane_restore
          docker exec -i "$READINESS_PG_CONTAINER" pg_restore -U postgres --exit-on-error --single-transaction --no-owner --no-acl -d omoikane_restore < "$fixture/recovery.dump"
          for db in omoikane_readiness omoikane_restore; do
            docker exec -i "$READINESS_PG_CONTAINER" psql -U postgres -XAt -v ON_ERROR_STOP=1 -d "$db" < scripts/recovery-fingerprint.sql > "$fixture/$db.json"
          done
          cmp "$fixture/omoikane_readiness.json" "$fixture/omoikane_restore.json"

      - name: Set up Node for isolated browser integration
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare isolated browser tooling and frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm install --prefix "$RUNNER_TEMP/omoikane-browser" --no-save playwright@1.65.1
          "$RUNNER_TEMP/omoikane-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify browser forms against disposable API and PostgreSQL
        working-directory: frontend
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/omoikane-browser/node_modules/playwright
        run: |
          set -euo pipefail
          java -jar ../backend/target/api-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod --spring.config.import= \
            --spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/omoikane_readiness \
            --spring.datasource.username=postgres --spring.datasource.password= \
            --app.admin.secret-key=readiness-test-only --app.cors.allowed-origins=http://127.0.0.1:3019 \
            --app.resend.api-key= --app.resend.from-email= --app.resend.admin-email= \
            --app.retention.enabled=false --app.email.worker-enabled=false \
            --app.rate-limit.requests-per-minute=1000 --server.address=127.0.0.1 --server.port=18080 \
            > "$RUNNER_TEMP/omoikane-fixture-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          BUSINESS_API_ORIGIN=http://127.0.0.1:18080 node scripts/verify-integrated-api.mjs

      - name: Retain fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-backend-readiness
          path: |
            backend/target/surefire-reports/
            ${{ runner.temp }}/omoikane-fixture-api.log
          retention-days: 7

      - name: Build deployable container
        run: docker build --file Dockerfile --tag omoikane-api:ci .

      # Dated release audit only: SSLRequest/handshake, no login or SQL.
      # Skip after merge and on unrelated branches.
      - name: Verify prelaunch TLS with the built runtime image
        if: github.head_ref == 'docs/task9-production-readiness-20261126' || github.ref_name == 'docs/task9-production-readiness-20261126'
        env:
          PREFLIGHT_NEON_HOST: ep-lingering-dew-aoqs32ya.c-2.ap-southeast-1.aws.neon.tech
        run: |
          set -euo pipefail
          tls_fixture=$(mktemp -d)
          trap 'rm -rf "$tls_fixture"' EXIT
          unzip -p target/api-0.0.1-SNAPSHOT.jar BOOT-INF/lib/postgresql-42.7.15.jar > "$tls_fixture/postgresql.jar"
          javac --release 21 --class-path "$tls_fixture/postgresql.jar" -d "$tls_fixture" scripts/VerifyPostgresTls.java
          chmod 755 "$tls_fixture"
          chmod 644 "$tls_fixture"/*
          docker run --rm --volume "$tls_fixture:/preflight:ro" --entrypoint java omoikane-api:ci \
            --class-path /preflight:/preflight/postgresql.jar VerifyPostgresTls "$PREFLIGHT_NEON_HOST"
