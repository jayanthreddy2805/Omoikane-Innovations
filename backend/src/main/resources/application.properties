spring.application.name=omoikane-api

# ── Server ──
server.port=${SERVER_PORT:8080}

# ── Datasource (PostgreSQL) ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/omoikane}
spring.datasource.username=${DATABASE_USERNAME:omoikane}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── CORS ──
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Resend ──
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:}
app.resend.from-name=${RESEND_FROM_NAME:Omoikane Innovations}

# ── Rate Limiting ──
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:5}

# ── Multipart Upload ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Logging ──
logging.level.com.omoikane=INFO
logging.level.org.flywaydb=INFO
