# The container starts with this profile. Required values must come from the host.
# Fail startup instead of connecting to a local database or allowing localhost CORS.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.admin.secret-key=${ADMIN_SECRET_KEY}

# Render's proxy supplies the original client address in forwarded headers.
# Let embedded Tomcat resolve it before the per-IP rate limiter reads remoteAddr.
server.forward-headers-strategy=native
